<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3A4CA3" />
  <title>UploadGo — Select. Share. Done.</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <div id="overlay-root"></div>
  <div id="toast-root"></div>
  <input
    type="file"
    id="fileInput"
    multiple
    accept=".jpg,.jpeg,.png,.webp,.gif,.mp4,.mov,.mkv,.zip,image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime,video/x-matroska,application/zip,application/x-zip,application/x-zip-compressed"
    hidden
  />
  <script src="app.js"></script>
</body>
</html>
